version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: enrichmcp-redis-shop
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight web UI
    environment:
      - REDIS_ARGS=--save 60 1000  # Save every 60 seconds if at least 1000 keys changed
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
    driver: local
